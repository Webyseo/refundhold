services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: authrail
      POSTGRES_USER: authrail
      POSTGRES_PASSWORD: authrail
    volumes:
      - authrail_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authrail -d authrail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  authrail_postgres_data:
