services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - refundhold_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      AUTHRAIL_DEMO_AGENT_API_KEY: ${AUTHRAIL_DEMO_AGENT_API_KEY:?AUTHRAIL_DEMO_AGENT_API_KEY is required}
      AUTHRAIL_DEMO_REVIEWER_EMAIL: ${AUTHRAIL_DEMO_REVIEWER_EMAIL:?AUTHRAIL_DEMO_REVIEWER_EMAIL is required}
      AUTHRAIL_ACTION_REQUEST_BASE_URL: ${AUTHRAIL_ACTION_REQUEST_BASE_URL:?AUTHRAIL_ACTION_REQUEST_BASE_URL is required}
      AUTHRAIL_DEMO_ACCESS_ENABLED: ${AUTHRAIL_DEMO_ACCESS_ENABLED:?AUTHRAIL_DEMO_ACCESS_ENABLED is required}
      AUTHRAIL_DEMO_ACCESS_PASSWORD: ${AUTHRAIL_DEMO_ACCESS_PASSWORD:?AUTHRAIL_DEMO_ACCESS_PASSWORD is required}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  refundhold_postgres_data:
    name: refundhold_postgres_data
